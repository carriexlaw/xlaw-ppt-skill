# 测试 deck：东南亚建厂决策报告（内部管理层，会议室投影，论证型）。第五轮：层级重写（focus 模型）+ 可视化拆解；留白仍是尺度优先（14 S-01–S-06）
deck:
  page: {w: 960, h: 540}
  margins: {l: 48, r: 48, t: 40, b: 40}
  title_anchor: {x: 48, y: 40, tol: 2}
  pagenum_anchor: {x: 880, y: 508, tol: 2}     # 15 页 ≤ 20：不放页码
  type_scale: [10.5, 12, 14, 16, 18, 20, 24, 28, 32, 36, 40, 48, 54, 60, 72]
  title_size: {min: 28, max: 40}
  min_size: 10.5
  fonts: [Source Han Sans CN, Avenir Next]
  fonts_latin: [Avenir Next]
  font_pairs: {Source Han Sans CN Bold: Avenir Next, Source Han Sans CN Medium: Avenir Next Medium, Source Han Sans CN Light: Avenir Next}
  palette:
    accent: [1F4FD8]
    secondary: [0B1F3A, 16305C]
    tertiary: [E3ECFC, F4F7FD]
    accent_light: [9CC8FF]
    data_muted: [8A9AB5]
    neutral: ['000000', FFFFFF, '333333', 7A7A7A, 3A4150, F3F4F6]
  accent_max_chars: 20
  shape_language: {corner: {small: full, medium: 12, large: 0}, stroke: 0.75}
  tone: argument

pages:
  - page: 1
    type: cover
    image:
      role: full-bleed
      layout: 1
      side: full
      source: pexels
      id: "13606787"
      photographer: Atlantic Ambience
      url: https://www.pexels.com/photo/an-aerial-photography-of-a-cargo-ship-sailing-on-the-sea-13606787/
      query: cargo ship open ocean aerial blue
      candidates_viewed: 20
      reason: 蓝天蓝海低地平线，货轮压在右下角，中央大片负空间可放居中标题；冷色与色板一致
  - page: 2
    type: agenda
    image:
      role: atmosphere
      layout: 5
      side: left
      source: pexels
      id: "27383355"
      photographer: Wolfgang Weiser
      url: https://www.pexels.com/photo/hochhausidylle-27383355/
      query: modern glass office building facade blue sky
      candidates_viewed: 20
      reason: 仰拍玻璃塔楼，裁成竖条后仍是一根向上的线，冷蓝；目录页按配图方式 5 贴左缘，与封面的海面区分开
  - page: 3
    type: statement
    message: 不建海外产能，三年内欧美订单流失四成
    image:
      role: full-bleed
      layout: 1
      side: full
      source: pexels
      id: "28970204"
      photographer: zs Lin
      url: https://www.pexels.com/photo/aerial-view-of-a-bridge-over-turquoise-water-28970204/
      query: aerial coastal highway ocean blue
      candidates_viewed: 20
      reason: 跨海大桥俯拍，画面只有一条线与青绿海面，负空间左右都有，压深色遮罩后文字可读；不与封面构图重复
  - page: 4
    type: content
    message: 税差扩大到 25 个点，价格优势已被抵消
    pattern: bar-chart
    focus: {object: 中越对美税差的趋势, form: chart, count: 1}
    density: light
    container: none
    columns: "1:1"
    g: 27.0
    source_chars: 111
    contrast: strong
    title_pos: base
    subtitle: false
    conclusion: true
    series: null
    visual_side: left
    chart: {focus_series: 越南}
  - page: 5
    type: content
    message: 前十大客户中六家已把海外产能写成准入条件
    pattern: grouped-categories
    focus: {object: 提出要求的客户类型, form: headings, count: 4}
    density: medium
    container: none
    columns: "2:1"
    g: 15.25
    source_chars: 146
    contrast: strong
    title_pos: base
    subtitle: false
    conclusion: true
    series: null
    visual_side: right
