# 负向测试 deck：故意违规，每条 M 检查至少命中一次（含 S-01–S-06）。deck 级 manifest 与干净 deck 相同。
# deck 级违规靠 pages 的声明制造：相邻页五项全同（C-20）、连续 heavy 且占比超限（C-22）、副标题 / 结论行占比与连续（C-23）、
# 每页都有容器（C-24）、模板复制感综合（C-26）、系列页占比（C-21 W）、主元素单一（C-25 W）。
deck:
  page: {w: 960, h: 540}
  margins: {l: 48, r: 48, t: 40, b: 40}
  title_anchor: {x: 48, y: 40, tol: 2}
  pagenum_anchor: {x: 48, y: 508, tol: 2}
  type_scale: [10.5, 12, 16, 20, 28, 40, 50, 72]
  title_size: {min: 27, max: 30}
  min_size: 10.5
  fonts: [Microsoft YaHei, Noto Sans SC, PingFang SC, Segoe UI, Avenir Next]
  fonts_latin: [Avenir Next]
  palette:
    accent: [1F4FD8]
    secondary: [0B1F3A, 16305C]
    tertiary: [EEF2F7, F6F8FB]
    neutral: ['000000', FFFFFF, '333333', 7A7A7A]
  accent_max_chars: 20
  shape_language: {corner: 4, stroke: 0.75}
  tone: argument

pages:
  - page: 1
    type: cover
  - page: 2                      # C-01：未标记形状
    type: content
    message: 未标记形状
    pattern: bullets
    focus: {object: 负向测试, form: numbers, count: 1}
    density: heavy
    container: divider
    columns: "1"
    g: 18
    source_chars: 900
    contrast: strong
    title_pos: base
    subtitle: true
    conclusion: true
    series: s
  - page: 3                      # C-02 标题偏移；C-13 字体 / 字号；C-14 颜色；C-16 页码
    type: content
    message: 锚点与字体颜色
    pattern: bullets
    focus: {object: 负向测试, form: numbers, count: 1}
    density: heavy
    container: divider
    columns: "1"
    g: 18
    source_chars: 900
    contrast: strong
    title_pos: base
    subtitle: true
    conclusion: true
    series: s
  - page: 4                      # C-03 主元素不足 3 倍 + 隐性第二主元素；C-11 kicker 存在但 subtitle=false、结论行复述标题
    type: content
    message: 主元素与结论行
    pattern: bullets
